# Run Clock settings. Changes apply from the next run.
# Every setting can be overridden by the environment variable named beside it, for example in a CI pipeline.

# Open this run's report in your browser when the run finishes.   RUN_CLOCK_OPEN
#   studio  runs started from Katalon Studio (default)
#   always  also Katalon Runtime Engine runs on a desktop
#   never   do not open it
openReport=studio

# What Run Clock remembers between runs.   RUN_CLOCK_HISTORY
#   on        learn from every run: medians, usual times, the All runs page (default)
#   readonly  compare with earlier runs without adding this one, for example in pull-request builds
#   off       every run stands alone
history=on

# Where the history is kept, relative to the project or absolute.   RUN_CLOCK_HISTORY_DIR
# Point it at a folder your CI keeps between builds.
historyDir=Reports/run-clock

# How many runs of each suite to remember.   RUN_CLOCK_HISTORY_LIMIT
historyLimit=50

# Warn when a run or a test takes this many percent longer than usual.   RUN_CLOCK_SLOWER_BY
slowerBy=25

# Post a one-line summary to a Slack-compatible incoming webhook. Keep the address out of source control:
# set RUN_CLOCK_WEBHOOK in your CI instead.   RUN_CLOCK_WEBHOOK
webhookUrl=

# Write summary.md for CI pages and the GitHub Actions job summary: on or off.   RUN_CLOCK_CI_SUMMARY
ciSummary=on
