<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="1200" height="232" role="img" aria-label="Contact Monty Bagati — Katalon speed tuning, CI pipelines, and feedback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1219"/>
      <stop offset="60%" stop-color="#171b26"/>
      <stop offset="100%" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5b1f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff5b1f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc857" stop-opacity="0"/>
    </linearGradient>
    <mask id="ticketMask">
      <rect x="16" y="16" width="1168" height="200" rx="18" fill="white"/>
      <circle cx="802" cy="16" r="11" fill="black"/>
      <circle cx="802" cy="216" r="11" fill="black"/>
    </mask>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', Times, serif; font-style: italic; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <g mask="url(#ticketMask)">
    <rect x="16" y="16" width="1168" height="200" fill="url(#bg)"/>
    <rect x="16" y="16" width="180" height="3" fill="url(#shimmer)">
      <animate attributeName="x" values="16;1004;16" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Status pill -->
    <rect x="48" y="40" width="286" height="24" rx="12" fill="#181c28" stroke="#2c3345"/>
    <circle cx="64" cy="52" r="4" fill="#3dd98f">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="77" y="56" class="mono" font-size="10.5" letter-spacing="1.0" fill="#c8cfdb">DIRECT LINE · SAY HELLO ONCE</text>

    <text x="48" y="102" class="sans" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#ece6da">Chasing faster Katalon builds? Let's talk.</text>
    <text x="48" y="136" class="serif" font-size="20.5" fill="#ff8456">parallel tuning · ci benchmarks · timelines · feedback</text>

    <text x="48" y="170" class="sans" font-size="13.5" fill="#a2aab9">Tuning test suites, benchmarking Azure/GitHub agents, or want a</text>
    <text x="48" y="190" class="sans" font-size="13.5" fill="#a2aab9">feature in Run Clock? Drop a note — I reply personally.</text>

    <!-- Perforation divider -->
    <line x1="802" y1="30" x2="802" y2="202" stroke="#2f3649" stroke-width="1.5" stroke-dasharray="5 6"/>

    <!-- Support stub -->
    <rect x="832" y="34" width="322" height="164" rx="13" fill="#10131b" stroke="#282f42"/>
    <text x="850" y="58" class="mono" font-size="10" letter-spacing="1.0" fill="#8b94a7">SUPPORT DESK · MONTY BAGATI</text>
    <line x1="850" y1="68" x2="1136" y2="68" stroke="#23293a"/>

    <rect x="850" y="79" width="286" height="32" rx="7" fill="#171b26" stroke="#2b3346"/>
    <text x="862" y="99" class="mono" font-size="10" fill="#ff8456">EMAIL</text>
    <text x="914" y="99" class="sans" font-size="12" font-weight="600" fill="#ece6da">bagati.monty@gmail.com</text>

    <rect x="850" y="118" width="286" height="32" rx="7" fill="#171b26" stroke="#2b3346"/>
    <text x="862" y="138" class="mono" font-size="10" fill="#3dd98f">LINKEDIN</text>
    <text x="926" y="138" class="sans" font-size="12" font-weight="600" fill="#ece6da">in/monty-bagati-90454626</text>

    <rect x="850" y="157" width="286" height="32" rx="7" fill="#171b26" stroke="#2b3346"/>
    <text x="862" y="177" class="mono" font-size="10" fill="#ffc857">GITHUB</text>
    <text x="918" y="177" class="sans" font-size="12" font-weight="600" fill="#ece6da">@montbaga · clickable links ↓</text>
  </g>
  <rect x="16" y="16" width="1168" height="200" rx="18" fill="none" stroke="#282f40" stroke-width="1.2" mask="url(#ticketMask)"/>
</svg>
