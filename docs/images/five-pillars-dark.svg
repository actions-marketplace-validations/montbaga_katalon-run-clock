<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-label="Five ways Run Clock surfaces real katalon performance">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="12" y="10" width="1176" height="156" rx="16" fill="#0f1219" stroke="#252c3b" stroke-width="1.2"/>
  <text x="32" y="35" class="mono" font-size="10.5" letter-spacing="1.2" fill="#8b94a7">FIVE MEASUREMENTS AT A GLANCE  ·  VERIFIED ACROSS 22 REAL RUNS</text>
  <text x="1168" y="35" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.0" fill="#8b94a7">ZERO TEST FAILURES · OUTSIDE CLOCK</text>

  <!-- Card 1 -->
  <rect x="28" y="48" width="216" height="104" rx="11" fill="#151924" stroke="#2b3346"/>
  <rect x="44" y="61" width="76" height="19" rx="5" fill="#2a1914" stroke="#ff5b1f" stroke-opacity="0.5"/>
  <text x="82" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#ff8456">01 · DIAL</text>
  <circle cx="226" cy="70" r="3.5" fill="#ff5b1f">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Real Wall Time</text>
  <text x="44" y="118" class="sans" font-size="11.2" fill="#a2aab9">Prepare to last JVM exit,</text>
  <text x="44" y="134" class="sans" font-size="11.2" fill="#a2aab9">minus report write time.</text>

  <!-- Card 2 -->
  <rect x="258" y="48" width="216" height="104" rx="11" fill="#151924" stroke="#2b3346"/>
  <rect x="274" y="61" width="76" height="19" rx="5" fill="#132920" stroke="#3dd98f" stroke-opacity="0.5"/>
  <text x="312" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#3dd98f">02 · RACE</text>
  <circle cx="456" cy="70" r="3.5" fill="#3dd98f">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="274" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Settings Raced</text>
  <text x="274" y="118" class="sans" font-size="11.2" fill="#a2aab9">Parallel off vs max 1–8</text>
  <text x="274" y="134" class="sans" font-size="11.2" fill="#a2aab9">using 5-run medians.</text>

  <!-- Card 3 -->
  <rect x="488" y="48" width="216" height="104" rx="11" fill="#151924" stroke="#2b3346"/>
  <rect x="504" y="61" width="76" height="19" rx="5" fill="#2a2213" stroke="#ffc857" stroke-opacity="0.5"/>
  <text x="542" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#ffc857">03 · BOOT</text>
  <circle cx="686" cy="70" r="3.5" fill="#ffc857">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="504" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Start-up X-Ray</text>
  <text x="504" y="118" class="sans" font-size="11.2" fill="#a2aab9">See Java launch overhead</text>
  <text x="504" y="134" class="sans" font-size="11.2" fill="#a2aab9">vs real test body time.</text>

  <!-- Card 4 -->
  <rect x="718" y="48" width="216" height="104" rx="11" fill="#151924" stroke="#2b3346"/>
  <rect x="734" y="61" width="84" height="19" rx="5" fill="#142530" stroke="#64d2ff" stroke-opacity="0.5"/>
  <text x="776" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#64d2ff">04 · SUITES</text>
  <circle cx="916" cy="70" r="3.5" fill="#64d2ff">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="734" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Collections</text>
  <text x="734" y="118" class="sans" font-size="11.2" fill="#a2aab9">Compare Sequential vs</text>
  <text x="734" y="134" class="sans" font-size="11.2" fill="#a2aab9">Parallel collection runs.</text>

  <!-- Card 5 -->
  <rect x="948" y="48" width="216" height="104" rx="11" fill="#151924" stroke="#2b3346"/>
  <rect x="964" y="61" width="80" height="19" rx="5" fill="#221c33" stroke="#b89cff" stroke-opacity="0.5"/>
  <text x="1004" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#c7b2ff">05 · ALERT</text>
  <circle cx="1146" cy="70" r="3.5" fill="#c7b2ff">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="964" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Regression Alerts</text>
  <text x="964" y="118" class="sans" font-size="11.2" fill="#a2aab9">Flag slower builds in</text>
  <text x="964" y="134" class="sans" font-size="11.2" fill="#a2aab9">HTML, CI tables &amp; Slack.</text>
</svg>
