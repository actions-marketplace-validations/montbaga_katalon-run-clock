<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Katalon Run Clock lifecycle: from JVM listener capture to offline reports and history">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="12" y="10" width="1176" height="200" rx="16" fill="#f3efe7" stroke="#d5cebf" stroke-width="1.2"/>
  <text x="32" y="34" class="mono" font-size="10.5" letter-spacing="1.2" fill="#5e6573">KATALON RUN CLOCK LIFECYCLE PIPELINE</text>
  <text x="1168" y="34" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.0" fill="#5e6573">ONE-TIME LAST-SUITE WRITE · EXCLUDED FROM CLOCK</text>

  <!-- Step 01 -->
  <rect x="28" y="52" width="224" height="136" rx="12" fill="#ffffff" stroke="#d8d1c4"/>
  <rect x="44" y="67" width="38" height="20" rx="5" fill="#ede8df"/>
  <text x="63" y="81" text-anchor="middle" class="mono" font-size="10.5" fill="#16181f">01</text>
  <text x="44" y="108" class="sans" font-size="15.5" font-weight="700" fill="#16181f">Listener Hooks</text>
  <text x="44" y="129" class="sans" font-size="11.5" fill="#4f5664">RunClockListener catches</text>
  <text x="44" y="146" class="sans" font-size="11.5" fill="#4f5664">JVM launch, suite &amp; test</text>
  <text x="44" y="163" class="sans" font-size="11.5" fill="#4f5664">start/end into *.jsonl.</text>

  <line x1="252" y1="120" x2="292" y2="120" stroke="#aba396" stroke-width="2" stroke-dasharray="4 4"/>
  <circle r="3.8" fill="#e04810">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M254,120 L290,120"/>
  </circle>

  <!-- Step 02 -->
  <rect x="292" y="52" width="234" height="136" rx="12" fill="#ffffff" stroke="#d8d1c4"/>
  <rect x="308" y="67" width="38" height="20" rx="5" fill="#ede8df"/>
  <text x="327" y="81" text-anchor="middle" class="mono" font-size="10.5" fill="#16181f">02</text>
  <text x="308" y="108" class="sans" font-size="15.5" font-weight="700" fill="#16181f">Every JVM Measured</text>
  <text x="308" y="129" class="sans" font-size="11.5" fill="#4f5664">Tracks prepare wait, Java</text>
  <text x="308" y="146" class="sans" font-size="11.5" fill="#4f5664">start-up, test body, idle,</text>
  <text x="308" y="163" class="sans" font-size="11.5" fill="#4f5664">and normal process exit.</text>

  <line x1="526" y1="120" x2="566" y2="120" stroke="#e04810" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="4 4"/>
  <circle r="4" fill="#e04810">
    <animateMotion dur="1.8s" begin="0.45s" repeatCount="indefinite" path="M528,120 L564,120"/>
  </circle>

  <!-- Step 03 -->
  <rect x="566" y="48" width="258" height="144" rx="13" fill="#ffffff" stroke="#e04810" stroke-width="1.6"/>
  <rect x="582" y="63" width="122" height="20" rx="5" fill="#fdebe4"/>
  <text x="643" y="77" text-anchor="middle" class="mono" font-size="9.5" fill="#c93e0c">03 · LAST SUITE EXIT</text>
  <text x="582" y="106" class="sans" font-size="16" font-weight="700" fill="#16181f">RunClockReport</text>
  <text x="582" y="127" class="sans" font-size="11.5" fill="#3f4654">Computes 5-run medians,</text>
  <text x="582" y="144" class="sans" font-size="11.5" fill="#3f4654">races settings &amp; takes the</text>
  <text x="582" y="161" class="sans" font-size="11.5" fill="#3f4654">10s lock on historyDir.</text>
  <text x="582" y="180" class="mono" font-size="9.2" fill="#c93e0c">OWN WRITE TIME LEFT OUT</text>

  <path d="M824,90 C852,90 854,70 884,70" fill="none" stroke="#118a52" stroke-opacity="0.65" stroke-width="1.6" stroke-dasharray="4 4"/>
  <path d="M824,120 L884,120" fill="none" stroke="#e04810" stroke-opacity="0.65" stroke-width="1.6" stroke-dasharray="4 4"/>
  <path d="M824,150 C852,150 854,170 884,170" fill="none" stroke="#b37400" stroke-opacity="0.65" stroke-width="1.6" stroke-dasharray="4 4"/>

  <circle r="3.4" fill="#118a52"><animateMotion dur="2s" repeatCount="indefinite" path="M824,90 C852,90 854,70 884,70"/></circle>
  <circle r="3.4" fill="#e04810"><animateMotion dur="2s" begin="0.3s" repeatCount="indefinite" path="M824,120 L884,120"/></circle>
  <circle r="3.4" fill="#b37400"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M824,150 C852,150 854,170 884,170"/></circle>

  <rect x="884" y="48" width="288" height="44" rx="9" fill="#f3fbf7" stroke="#9bd9bb"/>
  <rect x="896" y="60" width="84" height="20" rx="5" fill="#dcf4e8"/>
  <text x="938" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#0f7846">SUMMARY.HTML</text>
  <text x="990" y="67" class="sans" font-size="12" font-weight="700" fill="#16181f">Offline Single-Run Report</text>
  <text x="990" y="83" class="sans" font-size="10.5" fill="#4f5664">Dial, timeline, slowest &amp; splits</text>

  <rect x="884" y="98" width="288" height="44" rx="9" fill="#fff7f3" stroke="#f2b8a2"/>
  <rect x="896" y="110" width="84" height="20" rx="5" fill="#fde5dc"/>
  <text x="938" y="124" text-anchor="middle" class="mono" font-size="9.5" fill="#c93e0c">INDEX.HTML</text>
  <text x="990" y="117" class="sans" font-size="12" font-weight="700" fill="#16181f">All Runs Trend &amp; Diff</text>
  <text x="990" y="133" class="sans" font-size="10.5" fill="#4f5664">history.jsonl + 2-run diff</text>

  <rect x="884" y="148" width="288" height="44" rx="9" fill="#fffaf0" stroke="#e8cf97"/>
  <rect x="896" y="160" width="84" height="20" rx="5" fill="#fcf0d4"/>
  <text x="938" y="174" text-anchor="middle" class="mono" font-size="9.5" fill="#9c6200">CI + SLACK</text>
  <text x="990" y="167" class="sans" font-size="12" font-weight="700" fill="#16181f">Pipeline &amp; Webhook</text>
  <text x="990" y="183" class="sans" font-size="10.5" fill="#4f5664">summary.md + alert webhook</text>
</svg>
