name: Publish to npm

# Runs when a GitHub release is published. npm trusts this workflow through Trusted Publishing
# (npmjs.com > katalon-run-clock > Settings), so no token is stored here.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # the release tag, package.json and VERSION must agree; a version already on npm is skipped
      - name: Check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(node -p "require('./package.json').version")
          test "v$V" = "$TAG" || { echo "Release tag $TAG does not match package.json $V"; exit 1; }
          test "$V" = "$(tr -d '\r\n' < VERSION)" || { echo "VERSION file does not match package.json $V"; exit 1; }
          if npm view "katalon-run-clock@$V" version > /dev/null 2>&1; then
            echo "katalon-run-clock $V is already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish --access public
