name: Publish to npm

# Runs when a GitHub release is published. Needs a repository secret NPM_TOKEN:
# an npm access token that can publish katalon-run-clock.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # the release tag, package.json and VERSION must agree, or nothing is published
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(node -p "require('./package.json').version")
          test "v$V" = "$TAG" || { echo "Release tag $TAG does not match package.json $V"; exit 1; }
          test "$V" = "$(tr -d '\r\n' < VERSION)" || { echo "VERSION file does not match package.json $V"; exit 1; }

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
